name: Build PromptPro APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -q PromptPro-Repo-Ready.zip -d src
      - name: Apply code fixes
        working-directory: src
        run: |
          F=app/src/main/java/com/promptpro/app/MainActivity.kt
          sed -i 's/^import androidx.camera.video.AudioConfig$/import androidx.camera.view.video.AudioConfig/' $F
          sed -i 's/-39 + (1 - sensitivity) \* 9,/-39.0 + (1 - sensitivity.toDouble()) * 9,/' $F
          sed -i 's/floor + 7 + (1 - sensitivity) \* 9/floor + 7 + (1 - sensitivity.toDouble()) * 9/' $F
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: src
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptPro-debug-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
